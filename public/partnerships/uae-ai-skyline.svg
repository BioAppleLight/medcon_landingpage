<svg width="1200" height="900" viewBox="0 0 1200 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">UAE AI skyline</title>
  <desc id="desc">A bright purple UAE AI skyline with a Burj Khalifa silhouette, digital map, orbit rings, and an upward growth arrow.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#fbf9ff"/>
      <stop offset="1" stop-color="#e7dcff"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a291ff"/>
      <stop offset="0.48" stop-color="#7056e8"/>
      <stop offset="1" stop-color="#3d2b98"/>
    </linearGradient>
    <linearGradient id="softPurple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a793ff" stop-opacity="0.78"/>
      <stop offset="1" stop-color="#6347d8" stop-opacity="0.46"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="52%" cy="32%" r="54%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.34" stop-color="#ffffff" stop-opacity="0.82"/>
      <stop offset="1" stop-color="#cbbdff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cityGlow" cx="50%" cy="83%" r="46%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#e5dcff" stop-opacity="0.48"/>
      <stop offset="1" stop-color="#c7b5ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blurGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#6047dd" flood-opacity="0.22"/>
    </filter>
    <pattern id="dotGrid" width="9" height="9" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.45" fill="#927cff" opacity="0.42"/>
    </pattern>
    <pattern id="fineDots" width="7" height="7" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.05" fill="#b3a4ff" opacity="0.42"/>
    </pattern>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#centerGlow)"/>
  <rect width="1200" height="900" fill="url(#cityGlow)"/>

